# Denon AV receiver, captured from its remote with `ir-ctl --receive` for the
# old service.irblaster Kodi add-on (Denon's 48-bit protocol: a 3.4 ms header,
# then 48 bits). MUTE_TOGGLE is the capture's two frames. The INPUT_* names
# are this receiver's source buttons (Blu-ray, Game, DVD, Cable/Sat).
id = "denon-avr"
brand = "Denon"
name = "Denon AVR (captured)"
device_type = "avr"
carrier = 38000

